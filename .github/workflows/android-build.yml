name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Ensure Permanent Keystore is Present
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Restoring permanent consistent keystore from embedded base64..."
            cat << 'EOF' | base64 -d > debug.keystore
          
          EOF
          fi
          ls -la debug.keystore

      - name: Ensure Google Services Config is Present
        run: |
          mkdir -p app
          if [ ! -f app/google-services.json ]; then
            echo "Generating base google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "906974342849",
              "project_id": "whatsapp-channel-chat",
              "storage_bucket": "whatsapp-channel-chat.firebasestorage.app"
            },
            "client": [],
            "configuration_version": "1"
          }
          EOF
          fi

          echo "Ensuring google-services.json contains matching package name for build..."
          python3 - << 'PYEOF'
          import json, re

          with open("app/build.gradle.kts", "r") as f:
              content = f.read()

          m = re.search(r'applicationId\s*=\s*"([^"]+)"', content)
          app_id = m.group(1).strip() if m else "com.aistudio.applet.tlenci"

          with open("app/google-services.json", "r") as f:
              data = json.load(f)

          clients = data.get("client", [])
          existing_pkgs = {c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in clients}

          for pkg in [app_id, "com.aistudio.applet.tlenci", "com.aistudio.applet.uwmaqu", "com.example"]:
              if pkg and pkg not in existing_pkgs:
                  clients.append({
                      "client_info": {
                          "mobilesdk_app_id": f"1:906974342849:android:{pkg.split('.')[-1]}",
                          "android_client_info": {
                              "package_name": pkg
                          }
                      },
                      "oauth_client": [],
                      "api_key": [{"current_key": "AIzaSyBqlFQzFAAQudAvmBH_KXuDzkLE4gHO7qo"}],
                      "services": {}
                  })
                  existing_pkgs.add(pkg)

          data["client"] = clients
          with open("app/google-services.json", "w") as f:
              json.dump(data, f, indent=2)

          print(f"Verified google-services.json for clients: {list(existing_pkgs)}")
          PYEOF
          ls -la app/google-services.json

      - name: Ensure Drawables and Required Resources are Present
        run: |
          echo "Cleaning up any obsolete drawable_keep folders..."
          rm -rf app/src/main/res/drawable_keep

          echo "Ensuring drawable and values directories exist..."
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          if [ ! -f app/src/main/res/values/colors.xml ]; then
            echo "Creating fallback colors.xml..."
            cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#128C7E</color>
          </resources>
          EOF
          fi

          if [ ! -f app/src/main/res/drawable/ic_launcher_background.xml ]; then
            echo "Creating fallback ic_launcher_background.xml..."
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="@color/ic_launcher_background" />
          </shape>
          EOF
          fi

          if [ ! -f app/src/main/res/drawable/ic_launcher_foreground.xml ]; then
            echo "Creating fallback ic_launcher_foreground.xml..."
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,24C37.43,24 24,37.43 24,54c0,5.88 1.69,11.36 4.62,16.03L25,83l13.34,-3.5C42.82,82.35 48.24,84 54,84c16.57,0 30,-13.43 30,-30S70.57,24 54,24zM68.7,64.2c-0.62,1.74 -3.1,3.22 -4.3,3.37 -1.16,0.14 -2.66,0.22 -8.3,-2.11 -7.21,-2.97 -11.83,-10.3 -12.19,-10.78 -0.36,-0.48 -2.93,-3.9 -2.93,-7.44s1.85,-5.27 2.51,-5.99c0.66,-0.72 1.44,-0.9 1.92,-0.9 0.48,0 0.96,0.01 1.38,0.03 0.44,0.02 1.04,-0.17 1.62,1.23 0.6,1.44 2.04,4.98 2.22,5.34 0.18,0.36 0.3,0.78 0.06,1.26 -0.24,0.48 -0.36,0.78 -0.72,1.2 -0.36,0.42 -0.76,0.94 -1.08,1.26 -0.36,0.36 -0.74,0.76 -0.32,1.48 0.42,0.72 1.87,3.08 4.02,4.99 2.76,2.45 5.09,3.21 5.81,3.57 0.72,0.36 1.14,0.3 1.56,-0.18 0.42,-0.48 1.8,-2.1 2.28,-2.82 0.48,-0.72 0.96,-0.6 1.62,-0.36 0.66,0.24 4.2,1.98 4.92,2.34 0.72,0.36 1.2,0.54 1.38,0.84 0.18,0.3 0.18,1.74 -0.44,3.48z"/>
              </vector>
          EOF
          fi

          if [ ! -f app/src/main/res/drawable/ic_screen_share_notif.xml ]; then
            echo "Creating fallback ic_screen_share_notif.xml..."
            cat << 'EOF' > app/src/main/res/drawable/ic_screen_share_notif.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M20,18c1.1,0 1.99,-0.9 1.99,-2L22,6c0,-1.11 -0.9,-2 -2,-2H4c-1.11,0 -2,0.89 -2,2v10c0,1.1 0.89,2 2,2H0v2h24v-2h-4zM13,14.47v-2.19c-2.78,0 -4.61,0.85 -6,2.72c0.56,-2.67 2.11,-5.33 6,-5.87V7l4,3.73l-4,3.74z" />
          </vector>
          EOF
          fi

          ls -la app/src/main/res/drawable/

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Unified APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p artifacts
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk artifacts/Link-Assistant.apk
          elif ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/debug/*.apk artifacts/Link-Assistant.apk
          fi
          ls -lh artifacts/Link-Assistant.apk

      - name: Clean Up Old Workflow Artifacts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Cleaning up previous workflow artifacts to free Actions storage quota..."
          ARTIFACT_IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>/dev/null || true)
          for id in $ARTIFACT_IDS; do
            echo "Deleting old artifact ID: $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Publish Direct APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="latest-build"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" artifacts/Link-Assistant.apk \
              --target "${{ github.sha }}" \
              --title "Latest APK Build" \
              --notes "সরাসরি ডাউনলোডযোগ্য সর্বশেষ APK বিল্ড (TalkBack ও স্ক্রিন রিডার বান্ধব, আনজিপ করার প্রয়োজন নেই)।"
          else
            gh release upload "$TAG_NAME" artifacts/Link-Assistant.apk --clobber
            gh release edit "$TAG_NAME" --target "${{ github.sha }}" --title "Latest APK Build"
          fi

      - name: Upload APK Artifact (1-Day Retention)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Link-Assistant-APK
          path: artifacts/Link-Assistant.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          overwrite: true
